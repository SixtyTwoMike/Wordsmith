<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Wordsmith</title>
<meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wordsmith">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved theme before first paint (prefs.js keeps it in sync).
  try {
    var p = JSON.parse(localStorage.getItem('wordsmith.prefs.v1'));
    if (p && p.theme && p.theme !== 'system') document.documentElement.dataset.theme = p.theme;
  } catch (e) {}
</script>
</head>
<body>
<header id="topbar" class="glass">
  <button id="openScripts" class="topbtn" aria-label="Scripts">&#9776;</button>
  <input id="title" type="text" aria-label="Script title" placeholder="Untitled Script" autocomplete="off">
  <button id="openReview" class="topbtn topbtn-review" aria-label="Review"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.6c-.5.4-1.3.1-1.3-.6V16A2.5 2.5 0 0 1 4 13.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span id="reviewCount" class="badge" hidden>0</span></button>
  <button id="openOutline" class="topbtn topbtn-count" aria-label="Scene outline"><span id="pageCount">1</span> pp</button>
</header>
<nav id="timeline" aria-label="Script timeline" hidden></nav>
<main id="page" aria-label="Script"></main>
<div id="quickbar" class="glass">
  <div class="qb-row">
    <div id="chips" class="qb-chips" role="toolbar" aria-label="Scene and formatting"></div>
    <div class="qb-fixed">
      <button id="undoBtn" class="chip chip-tool" aria-label="Undo">&#8630;</button>
      <button id="redoBtn" class="chip chip-tool" aria-label="Redo">&#8631;</button>
      <button id="cycleType" class="chip chip-tool" aria-label="Change element type">Aa</button>
      <button id="openSettings" class="chip chip-tool" aria-label="Settings">&#9881;</button>
    </div>
  </div>
  <div class="qb-row">
    <div id="charChips" class="qb-chips" role="toolbar" aria-label="Characters"></div>
  </div>
</div>
<div id="settingsSheet" hidden></div>
<div id="scriptsSheet" hidden></div>
<div id="outlineSheet" hidden></div>
<div id="exportSheet" hidden></div>
<div id="profileSheet" hidden></div>
<div id="snippetSheet" hidden></div>
<div id="reviewSheet" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
