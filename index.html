<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Wordsmith</title>
<meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wordsmith">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar" class="glass">
  <button id="openScripts" class="topbtn" aria-label="Scripts">&#9776;</button>
  <input id="title" type="text" aria-label="Script title" placeholder="Untitled Script" autocomplete="off">
  <button id="openOutline" class="topbtn topbtn-count" aria-label="Scene outline"><span id="pageCount">1</span> pp</button>
</header>
<main id="page" aria-label="Script"></main>
<div id="quickbar" class="glass">
  <div class="qb-row">
    <div id="chips" class="qb-chips" role="toolbar" aria-label="Scene and formatting"></div>
    <div class="qb-fixed">
      <button id="undoBtn" class="chip chip-tool" aria-label="Undo">&#8630;</button>
      <button id="redoBtn" class="chip chip-tool" aria-label="Redo">&#8631;</button>
      <button id="cycleType" class="chip chip-tool" aria-label="Change element type">Aa</button>
      <button id="openSettings" class="chip chip-tool" aria-label="Settings">&#9881;</button>
    </div>
  </div>
  <div class="qb-row">
    <div id="charChips" class="qb-chips" role="toolbar" aria-label="Characters"></div>
  </div>
</div>
<div id="settingsSheet" hidden></div>
<div id="scriptsSheet" hidden></div>
<div id="outlineSheet" hidden></div>
<div id="exportSheet" hidden></div>
<div id="profileSheet" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
